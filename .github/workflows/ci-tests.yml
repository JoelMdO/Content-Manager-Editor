name: CI — Editor Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  # ─── Job 1: Lint ────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run ESLint
        run: pnpm run lint

  # ─── Job 2: Unit & Integration Tests ─────────────────────────────────────
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    env:
      # Test-only crypto values — these are NOT production secrets.
      # The matching .env.test is also committed for local jest runs.
      saltLength: "16"
      ivLength: "12"
      tagLength: "16"
      keyLength: "32"
      iterations: "10000"
      digest: "sha256"
      algorithm: "aes-256-gcm"
      secure_key: "dGVzdC1zZWN1cmUta2V5LWZvci10ZXN0aW5nLW9ubHk="
      NEXTAUTH_URL: "http://localhost:8000"
      NEXTAUTH_SECRET: "test-nextauth-secret-for-ci"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Jest with coverage
        run: pnpm run test --coverage --ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  # ─── Job 3: E2E Tests (Cypress) ──────────────────────────────────────────
  # Requires the following GitHub Secrets to be configured:
  #   NEXTAUTH_SECRET           — NextAuth signing secret
  #   GOOGLE_CLIENT_ID          — Google OAuth client ID
  #   GOOGLE_CLIENT_SECRET      — Google OAuth client secret
  #   LOGIN_API_ENDPOINT        — Django /auth/login/ URL
  #   USERS_API_ENDPOINT        — Django /auth/users/ URL
  #   PASSWORD_RESET_API_ENDPOINT — Django /auth/password-reset/ URL
  #   INTERNAL_API_KEY          — Shared internal secret for /api/auth/users/
  #   CLOUDINARY_*              — Cloudinary credentials
  #   CYPRESS_TEST_EMAIL        — Test user email for cy.login()
  #   CYPRESS_TEST_PASSWORD     — Test user password for cy.login()
  e2e:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: unit-tests
    # Only run e2e from PRs opened from within the same repository
    # (fork PRs do not have access to the required secrets)
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Next.js application
        run: pnpm run build
        env:
          NEXTAUTH_URL: "http://localhost:8000"
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          LOGIN_API_ENDPOINT: ${{ secrets.LOGIN_API_ENDPOINT }}
          USERS_API_ENDPOINT: ${{ secrets.USERS_API_ENDPOINT }}
          PASSWORD_RESET_API_ENDPOINT: ${{ secrets.PASSWORD_RESET_API_ENDPOINT }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}

      - name: Start production server in background
        run: pnpm start &
        env:
          NEXTAUTH_URL: "http://localhost:8000"
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          LOGIN_API_ENDPOINT: ${{ secrets.LOGIN_API_ENDPOINT }}
          USERS_API_ENDPOINT: ${{ secrets.USERS_API_ENDPOINT }}
          PASSWORD_RESET_API_ENDPOINT: ${{ secrets.PASSWORD_RESET_API_ENDPOINT }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}

      - name: Wait for server to be ready
        run: |
          echo "Waiting for Next.js server on port 8000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000 > /dev/null 2>&1; then
              echo "Server is ready after ${i} attempts."
              break
            fi
            echo "  attempt $i/30 — retrying in 2s"
            sleep 2
          done

      - name: Run Cypress E2E tests
        run: pnpm cypress:run
        env:
          CYPRESS_testEmail: ${{ secrets.CYPRESS_TEST_EMAIL }}
          CYPRESS_testPassword: ${{ secrets.CYPRESS_TEST_PASSWORD }}

      - name: Upload Cypress screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
